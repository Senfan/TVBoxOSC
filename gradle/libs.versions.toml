# Exact declared versions. Pending upgrades are tracked in docs/sony-dependency-upgrade.md.
# This catalog is NOT a resolved lockfile or proof of Sony runtime compatibility.
[versions]
kotlin = "2.4.21"
room = "2.6.1"
media3 = "1.3.1"
glide = "4.16.0"
andserver = "2.1.12"
dkplayer = "3.3.7"
nanohttpd = "2.3.1"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
sardine = { module = "com.github.thegrizzlylabs:sardine-android", version = "v0.9" }
nanohttpd = { module = "org.nanohttpd:nanohttpd", version.ref = "nanohttpd" }
nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpd" }
zxing = { module = "com.google.zxing:core", version = "3.5.4" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version = "2.2.2" }
lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version = "2.2.0" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
viewpager2 = { module = "androidx.viewpager2:viewpager2", version = "1.1.0" }
material = { module = "com.google.android.material:material", version = "1.12.0" }
