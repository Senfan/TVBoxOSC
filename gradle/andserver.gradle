import org.gradle.api.DefaultTask
import org.gradle.api.file.DirectoryProperty
import org.gradle.api.provider.Property
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.TaskAction

// AndServer 2.1.12's AppInfo annotation and discovery asset contract,
// registered through AGP's public generated-source API instead of BaseVariant.
abstract class GenerateAndServerIdentity extends DefaultTask {
    @Input abstract Property<String> getApplicationId()
    @OutputDirectory abstract DirectoryProperty getJavaDirectory()
    @OutputDirectory abstract DirectoryProperty getAssetsDirectory()

    @TaskAction
    void generate() {
        String id = applicationId.get()
        if (!(id ==~ /[A-Za-z_][A-Za-z0-9_]*(\.[A-Za-z_][A-Za-z0-9_]*)+/)) {
            throw new GradleException('Invalid AndServer application identity')
        }
        File source = new File(javaDirectory.get().asFile,
                id.replace('.', '/') + '/andserver/plugin/generator/TvBoxAppInfo.java')
        source.parentFile.mkdirs()
        source.setText("""package ${id}.andserver.plugin.generator;

@com.yanzhenjie.andserver.annotation.AppInfo("${id}")
public final class TvBoxAppInfo {
}
""", 'UTF-8')
        File asset = new File(assetsDirectory.get().asFile, id + '.andserver')
        asset.parentFile.mkdirs()
        asset.setText(id + '.andserver', 'UTF-8')
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def identity = tasks.register("generate${variant.name.capitalize()}AndServerIdentity", GenerateAndServerIdentity) {
            applicationId.set(variant.applicationId)
            javaDirectory.set(layout.buildDirectory.dir("generated/andserver/${variant.name}/java"))
            assetsDirectory.set(layout.buildDirectory.dir("generated/andserver/${variant.name}/assets"))
        }
        variant.sources.java.addGeneratedSourceDirectory(identity) { it.javaDirectory }
        variant.sources.assets.addGeneratedSourceDirectory(identity) { it.assetsDirectory }
    }
}
