// Top-level build configuration. Sony normal builds do not configure Python.
buildscript {
    ext.kotlin_version = "2.4.21"
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        if (gradle.startParameter.projectProperties.get('enablePython') == 'true') {
            maven { url "https://chaquo.com/maven" }
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.0'
        classpath 'com.android.tools.build:gradle-kotlin:9.5.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        if (gradle.startParameter.projectProperties.get('enablePython') == 'true') {
            // Not part of the Sony normal package; Python requires its own migration.
            classpath "com.chaquo.python:gradle:12.0.1"
        }
    }
}

allprojects {
    dependencyLocking {
        lockAllConfigurations()
    }
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url "https://maven.aliyun.com/repository/google" }
        maven { url "https://maven.aliyun.com/repository/public" }
        maven { url "https://maven.aliyun.com/repository/releases" }
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
