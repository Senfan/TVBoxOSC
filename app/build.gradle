apply plugin: 'com.android.application'
apply plugin: 'com.android.legacy-kapt'
apply from: rootProject.file('gradle/andserver.gradle')

def appVersion = new Properties()
rootProject.file('version.properties').withInputStream { appVersion.load(it) }
def readVersionCode = { String value ->
    if (value == null || !(value ==~ /[1-9][0-9]*/) || new BigInteger(value) > 2100000000) {
        throw new GradleException('versionCode must be an integer between 1 and 2100000000')
    }
    return value.toInteger()
}
def releaseVersionCode = readVersionCode(appVersion.getProperty('versionCode'))
def releaseVersionName = appVersion.getProperty('versionName', '').trim()
if (releaseVersionName.isEmpty()) throw new GradleException('versionName must not be empty')
def debugOverride = project.findProperty('debugUpdateVersionCode')
def effectiveVersionCode = debugOverride == null ? releaseVersionCode : readVersionCode(debugOverride.toString())

def releaseSigning = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { releaseSigning.load(it) }
def hasReleaseSigning = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every {
    !releaseSigning.getProperty(it, '').trim().isEmpty()
}
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('release') }) {
        if (debugOverride != null) throw new GradleException('debugUpdateVersionCode is forbidden for release builds')
        if (!hasReleaseSigning || !rootProject.file(releaseSigning.getProperty('storeFile', '')).isFile()) {
            throw new GradleException('Release requires a local signing.properties and an existing release keystore; see docs/online-update.md')
        }
    }
}

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 37

    defaultConfig {
        applicationId 'com.github.tvbox.osc.tk'
        targetSdk 34
        versionCode effectiveVersionCode
        versionName releaseVersionName
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    packaging {
        resources {
            excludes += 'META-INF/DEPENDENCIES'
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            production {
                storeFile rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
                enableV1Signing = true
                enableV2Signing = true
            }
        }
    }
    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            if (hasReleaseSigning) signingConfig signingConfigs.production
        }
    }

    flavorDimensions += ["abi", "brand", "mode"]
    productFlavors {
        armeabi {
            dimension = "abi"
            buildConfigField 'String', 'UPDATE_ABI', '"armeabi-v7a"'
            manifestPlaceholders.updateAbi = 'armeabi-v7a'
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        arm64 {
            dimension = "abi"
            buildConfigField 'String', 'UPDATE_ABI', '"arm64-v8a"'
            manifestPlaceholders.updateAbi = 'arm64-v8a'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        generic  {
            //通用版本
            dimension = "brand"
            buildConfigField 'String', 'UPDATE_BRAND', '"generic"'
            manifestPlaceholders.updateBrand = 'generic'
        }

        hisense {
            //海信的
            applicationId 'com.github.hisense.osc.tk'
            dimension = "brand"
            buildConfigField 'String', 'UPDATE_BRAND', '"hisense"'
            manifestPlaceholders.updateBrand = 'hisense'
        }
        normal {
            dimension = "mode"
            buildConfigField 'String', 'UPDATE_MODE', '"normal"'
            manifestPlaceholders.updateMode = 'normal'
            minSdk 21
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        python {
            dimension = "mode"
            buildConfigField 'String', 'UPDATE_MODE', '"python"'
            manifestPlaceholders.updateMode = 'python'
            minSdk 21
            // Python 版本需要额外的 Proguard 规则
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-python.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        dataBinding = true
        buildConfig = true
    }

    lint {
        // Existing policy, not a workaround for migration failures.
        checkReleaseBuilds = false
        abortOnError = false
        disable 'UnsafeOptInUsageError'
    }
}

androidComponents {
    beforeVariants(selector().all()) { variant ->
        if (findProject(':pyramid') == null && variant.productFlavors.any { it.first == 'mode' && it.second == 'python' }) {
            variant.enable = false
        }
    }
}

