    implementation libs.kotlin.stdlib
    // for WebDAV
    implementation(libs.sardine) {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation libs.nanohttpd
    implementation libs.nanohttpd.websocket
    implementation libs.zxing
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.lifecycle.extensions
    implementation libs.recyclerview
    constraints {
        implementation(libs.viewpager2) {
            because 'Use the stable release instead of the transitive 1.1.0-beta02'
        }
    }
    implementation libs.material
    implementation project(path: ':quickjs')
    if (findProject(':pyramid') != null) {
        pythonImplementation project(':pyramid')
    }
    
    kapt libs.room.compiler
    implementation libs.flowlayout
    implementation libs.room.runtime
    implementation libs.multidex
    implementation libs.okhttp
    implementation libs.okio
    implementation libs.brvah
    implementation libs.loadsir
    implementation libs.gson
    implementation libs.glide
    kapt libs.glide.compiler
    implementation libs.autosize
    implementation(libs.xstream) {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation libs.eventbus
    implementation libs.hawk
    implementation libs.retrofuture
    implementation libs.annotation
    implementation libs.media3.exoplayer
    implementation libs.media3.ui
    implementation libs.media3.dash
    implementation libs.media3.hls
    implementation libs.media3.rtsp
    implementation libs.media3.rtmp
    implementation libs.media3.common
    implementation libs.nextlib



    implementation libs.aliyun.player
    implementation libs.aliyun.conan
    implementation libs.dkplayer.ui
    implementation libs.dkplayer.cache

    implementation libs.okgo
    implementation libs.tv.recyclerview
    implementation libs.utilcodex
    implementation libs.permissions
    implementation libs.jsoup
    implementation libs.filechooser
    implementation libs.commons.io
    implementation libs.chardet
//    implementation files('libs/thunder.jar')
    implementation libs.commons.text
    implementation libs.jcifs
    implementation libs.conscrypt
    implementation libs.viewpump
    implementation libs.calligraphy
    implementation libs.andserver.api
    kapt libs.andserver.processor
    implementation libs.danmaku
    implementation(libs.simplexml) {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
    }
    configurations {
        configureEach {
            exclude group: 'xpp3', module: 'xpp3'
        }
    }
}
